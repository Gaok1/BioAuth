[package]
name = "phone-auth-session"
description = "Authenticated, transport-independent PhoneAuth secure-session handshake and record layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published to crates.io. These crates are the internals of one
# application, they reference each other by path, and a version number on
# crates.io would be a promise this project has no reason to make.
publish = false

[dependencies]
phone-auth-protocol.workspace = true
p256.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
x25519-dalek.workspace = true
getrandom.workspace = true

[dev-dependencies]
proptest = "1.9.0"
