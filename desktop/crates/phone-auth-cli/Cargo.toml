[package]
name = "phone-auth-cli"
description = "Command line client for the PhoneAuth agent; the entry point used by PAM, sudo and scripts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published to crates.io. These crates are the internals of one
# application, they reference each other by path, and a version number on
# crates.io would be a promise this project has no reason to make.
publish = false

[[bin]]
name = "phone-auth"
path = "src/main.rs"

[dependencies]
# Linked directly so that `locker status` and recovery-code unlocking work with
# the agent stopped. Recovery that needs a running daemon is not recovery.
phone-auth-locker.workspace = true
phone-auth-agent.workspace = true
serde_json.workspace = true
