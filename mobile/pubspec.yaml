name: phone_auth
description: Offline-first mobile authenticator for BioAuth.
publish_to: none
version: 0.1.5+6

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  mobile_scanner: ^7.4.0
  phone_auth_native:
    path: ../packages/phone_auth_native
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Already in the tree through flutter_test; named here because the reconnect
  # backoff is tested by advancing a clock rather than by waiting on one.
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  # Only used by tool/build_flow_gif.dart, which stitches the frames written by
  # test/media/capture_screens.dart into the animation in the README.
  image: ^4.5.4

flutter:
  uses-material-design: true
