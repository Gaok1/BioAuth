name: phone_auth
description: Offline-first mobile authenticator for BioAuth.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  cbor: ^6.5.1
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  phone_auth_native:
    path: ../packages/phone_auth_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
