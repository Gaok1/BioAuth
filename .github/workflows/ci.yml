name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      # `flutter-action`'s cache covers the SDK, not the packages it resolves.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'packages/phone_auth_native/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      # Hooks the Gradle user home into the Actions cache. It applies to every
      # later gradlew invocation, including the one `flutter build apk` makes.
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android trust snapshots
        run: python3 scripts/update_android_trust_snapshots.py
      - name: Flutter checks
        working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze
          flutter test
          flutter build apk --debug --flavor dev --target lib/main_dev.dart
      - name: Native plugin checks
        working-directory: packages/phone_auth_native
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      # `testDevDebugUnitTest` only reaches `:app`, which has no unit tests at
      # all. The plugin is a library module with no flavours, so its Kotlin
      # tests — including the RP ID validation ones — live behind
      # `:phone_auth_native:testDebugUnitTest` and were never being run.
      - name: Android lint and native unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew lintDevDebug testDevDebugUnitTest \
            :phone_auth_native:testDebugUnitTest

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Without this the runner's user is not in the `kvm` group, the emulator
      # says "This user doesn't have permissions to use KVM (/dev/kvm)" and
      # falls back to `-accel off`. An API 35 x86_64 image interpreted in
      # software does not reach `sys.boot_completed` inside the ten minutes the
      # runner waits, so the job failed on "Timeout waiting for emulator to
      # boot" without running a single test -- and this job is the only thing
      # that ever exercises the credential provider.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      # `flutter pub get` writes the plugin registrant, but the Gradle
      # wrapper is in Flutter's own .gitignore and so is never in a fresh
      # checkout. `flutter build` generates it; chmod'ing it first cannot work.
      - name: Resolve Flutter plugins
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --config-only --flavor dev --target lib/main_dev.dart
          test -f android/gradlew || {
            echo "::error::the Gradle wrapper was not generated"; exit 1; }
          chmod +x android/gradlew
      - name: Android 15 credential-provider instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./mobile/android/gradlew -p mobile/android :phone_auth_native:connectedDebugAndroidTest

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: BlueZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # Without this every push recompiles the whole workspace, dependencies
      # included. Keyed on the lockfile, so it only rebuilds what changed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # Electron 44 declares `node >= 22.12.0`. npm only warns about an
      # engine mismatch by default, so a 20 here does not fail the install
      # outright — it fails later, somewhere less obvious.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm ci` now, and it did not used to be needed: every other module
      # under test requires only Node built-ins. One does not -- the extension
      # is linted with `addons-linter`, Mozilla's own validator, which is the
      # only check here that knows AMO's current rules rather than what someone
      # believed them to be. Without the install that test fails to load, and a
      # file that cannot load takes the whole `node --test` run with it.
      #
      # Nothing here launches Electron, so its ~100 MB binary is skipped; the
      # package is a devDependency of electron-builder's config, not something
      # this job runs.
      - name: Tray tests
        working-directory: desktop/ui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
      - name: Nautilus integration tests
        run: bash desktop/file-manager/tests/linux.sh
      - name: Rust checks
        working-directory: desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          # `--all-features`: `dev-simulator` is off by default, and the tests
          # that drive a phone over a real socket are gated on it. Without it
          # they compile to nothing and report "0 passed", which reads exactly
          # like passing.
          cargo test --workspace --all-features
      # The property suites run at proptest's default of 256 cases in a normal
      # `cargo test`, so a local run stays quick. Here they get a budget worth
      # having: these are the decoders that read bytes nobody has authenticated
      # yet, and 256 random frames is a smoke test, not a search.
      #
      # The timeout is the memory limit as well as the clock one — the
      # properties that matter are about a peer making this process allocate,
      # and a case that hangs is a case that found one.
      - name: Decoder and framing properties
        working-directory: desktop
        timeout-minutes: 10
        env:
          PROPTEST_CASES: 4096
        run: |
          cargo test -p phone-auth-protocol --test decoder_properties
          cargo test -p phone-auth-session decoder_properties
          cargo test -p phone-auth-agent --test framing_properties
          PROPTEST_CASES=256 cargo test -p phone-auth-locker --test container_properties

      # Licences and advisories are different questions. A crate can have no
      # CVEs and still be one this project cannot ship inside a signed
      # installer, and a review that conflates the two lets the second through.
      - name: Dependency policy
        working-directory: desktop
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Explorer integration tests
        shell: powershell
        run: .\desktop\file-manager\tests\windows.ps1
      - name: Authenticode verifier rejects unsigned files
        shell: powershell
        run: |
          $result = .\desktop\ui\src\verify-authenticode.ps1 `
            -Path .\desktop\file-manager\phone-auth-file-manager.cmd |
            ConvertFrom-Json
          if ($result.valid -or $result.publicKey -or $result.fileVersion) {
            throw 'unsigned file was reported as a trusted update'
          }
      # This is a separate job rather than a matrix entry because Linux alone
      # needs BlueZ headers. More importantly, it compiles and runs the code
      # behind cfg(windows): DACLs, clipboard exclusions, hard-link counting
      # and process-interruption atomicity.
      # `shell: bash` rather than the Windows default. A multi-command `run`
      # under PowerShell only reports the exit code of the *last* command:
      # `$ErrorActionPreference` governs cmdlets, not native executables, so a
      # failing `cargo fmt` or `cargo clippy` here would scroll past and the
      # job would go green on the strength of `cargo test` alone. Which is the
      # worst way for a check to fail, because nobody looks at a green job.
      #
      # `--all-features` for the same reason it is on the Linux job: the tests
      # that drive a phone over a real socket are gated on `dev-simulator`, and
      # without the flag they compile to nothing and report "0 passed", which
      # reads exactly like passing.
      - name: Rust checks on Windows
        working-directory: desktop
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  # Four ecosystems, four lockfiles, one scanner. Rust and npm each have their
  # own auditing tool and pub has none at all, so a per-ecosystem approach
  # would leave the Flutter side unwatched — which is where the app that holds
  # the vault lives.
  supply-chain:
    name: Dependencies and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Known vulnerabilities across every lockfile
        # Pinned to a real tag: this action publishes no moving `v2`, so the
        # major-version ref that reads as obviously correct resolves to nothing
        # and the job dies in "Set up job" before running a step.
        #
        # Three lockfiles, not four. `packages/phone_auth_native/pubspec.lock`
        # was listed here and is in that package's own `.gitignore`, so it
        # never exists in a fresh checkout and the scanner exited 127 —
        # scanning nothing at all — every time this job ran. Dart is right to
        # ignore it: a library package's lock is a resolution nobody installs,
        # because the application resolves the graph again. What ships is
        # `mobile/pubspec.lock`, which is committed and is scanned below.
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=desktop/Cargo.lock
            --lockfile=desktop/ui/package-lock.json
            --lockfile=mobile/pubspec.lock

      # Kept as a build artefact rather than only a log line: answering "was
      # this version affected" months later needs the list as it was then, not
      # as it is now.
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json
