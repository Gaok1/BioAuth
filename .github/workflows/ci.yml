name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      # `flutter-action`'s cache covers the SDK, not the packages it resolves.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'packages/phone_auth_native/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      # Hooks the Gradle user home into the Actions cache. It applies to every
      # later gradlew invocation, including the one `flutter build apk` makes.
      - uses: gradle/actions/setup-gradle@v4
      - name: Flutter checks
        working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze
          flutter test
          flutter build apk --debug --flavor dev --target lib/main_dev.dart
      - name: Native plugin checks
        working-directory: packages/phone_auth_native
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Android lint and native unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew lintDevDebug testDevDebugUnitTest

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: BlueZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # Without this every push recompiles the whole workspace, dependencies
      # included. Keyed on the lockfile, so it only rebuilds what changed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No `npm ci`: the main-process modules under test require only Node
      # built-ins, which is what makes them testable without Electron at all.
      - name: Tray tests
        working-directory: desktop/ui
        run: npm test
      - name: Rust checks
        working-directory: desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
