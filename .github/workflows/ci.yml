name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Flutter checks
        working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
          flutter build apk --debug --flavor dev --target lib/main_dev.dart
      - name: Native plugin checks
        working-directory: packages/phone_auth_native
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Android lint and native unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew lintDevDebug testDevDebugUnitTest

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: BlueZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Rust checks
        working-directory: desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
