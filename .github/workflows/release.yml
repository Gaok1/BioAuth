name: Release

# Builds every artifact a user could install and attaches them to a GitHub
# Release. Three ways in, all landing in the same jobs:
#
#   push to main   bump the workspace version and the release cuts itself
#   push of a tag  release that exact tag, for anything cut by hand
#   dispatch       build the whole set without publishing, to test this file
#
# The tag is created by the release step rather than pushed by an earlier job,
# because a tag pushed with GITHUB_TOKEN does not trigger workflows — GitHub
# blocks that to stop runs feeding themselves. A two-workflow design would look
# right and silently build nothing.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance is signed with a short-lived certificate issued to this
  # workflow run, so there is no key for anybody to hold or lose.
  id-token: write
  attestations: write

env:
  FLUTTER_VERSION: 3.47.1
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ Gate ---
  # Decides the version and whether this run has anything to do, so an ordinary
  # commit to main costs ten seconds instead of four parallel builds.
  gate:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Four files carry the version independently. They are all read by
      # something a user sees — the installer filename, the APK's versionName,
      # the Nix package — so a release where they disagree ships artifacts that
      # claim to be different versions of each other.
      - name: Check the declared versions agree
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' \
            desktop/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version in desktop/Cargo.toml"; exit 1; }
          echo "canonical: $version"

          fail=0
          check() {
            if [ "$2" != "$version" ]; then
              echo "::error::$1 declares '$2', desktop/Cargo.toml says '$version'"
              fail=1
            fi
          }
          check mobile/pubspec.yaml \
            "$(sed -n 's/^version: \([0-9.]*\).*/\1/p' mobile/pubspec.yaml | head -1)"
          check desktop/ui/package.json \
            "$(sed -n 's/.*"version": "\(.*\)".*/\1/p' desktop/ui/package.json | head -1)"
          check desktop/nixos/package.nix \
            "$(sed -n 's/.*version = "\(.*\)".*/\1/p' desktop/nixos/package.nix | head -1)"
          [ "$fail" = 0 ] || exit 1

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide what to do
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              # Cut by hand. Build and publish exactly this tag.
              echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              tag="v$VERSION"
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "$tag already exists — nothing to release."
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "version bumped to $VERSION — releasing $tag."
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "publish=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              # Manual dispatch: prove the workflow still works, publish nothing.
              echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
  # ---------------------------------------------------------------- Android --
  android:
    name: Android APK
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Lifted to the job so a step condition can read it: the `secrets` context
    # is not available inside an `if`, and a workflow that references it there
    # fails to parse rather than evaluating to false.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter-action`'s cache covers the SDK, not the packages it resolves,
      # and not Gradle's dependency downloads — which are the slow half of an
      # APK build.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      # A published release must be signed with the project key. A manual
      # dispatch without secrets may still produce an explicitly named debug
      # artifact for workflow testing, but it can never reach a release.
      - name: Validate and decode signing material
        id: signing
        env:
          PUBLISH: ${{ needs.gate.outputs.publish }}
        run: |
          configured=0
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done

          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "::error::Android release signing is only partially configured"
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$configured" -ne 4 ]; then
            echo "::error::Published releases require all four Android signing secrets"
            exit 1
          fi
          if [ "$configured" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/release.jks
          cat > mobile/android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile
        run: |
          flutter build apk --release --flavor prod --target lib/main_prod.dart
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
             ../artifacts/PhoneAuth-android.apk

      - name: Build debug-signed APK
        if: steps.signing.outputs.signed != 'true'
        working-directory: mobile
        run: |
          flutter build apk --debug --flavor prod --target lib/main_prod.dart
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-prod-debug.apk \
             ../artifacts/PhoneAuth-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows installer
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    # Lifted to the job for the same reason the Android secrets are: the
    # `secrets` context cannot be read inside a step `if`.
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # The installer bundles these, so they have to exist before packaging.
      # `phone-auth-initrd` is deliberately absent: it unlocks a LUKS volume
      # from a Linux initrd and means nothing on Windows.
      - name: Build agent and CLI
        working-directory: desktop
        run: cargo build --release -p phone-auth-agent -p phone-auth-cli

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      # `npm ci` is cached by setup-node, but electron-builder separately pulls
      # down the Electron runtime and its winCodeSign helper on every run —
      # roughly 150 MB that never changes between releases.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/ui/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Package tray
        working-directory: desktop/ui
        run: |
          npm ci
          npx electron-builder --win --publish never

      # Authenticode. Without it Windows shows "Unknown publisher" on every
      # install and SmartScreen warns for as long as the download is rare —
      # which teaches users to click through exactly the warning that would
      # tell them about a substituted installer.
      #
      # Same shape as the Android rule: a dispatch may build unsigned to prove
      # the workflow works, a publish may not.
      - name: Sign the installer
        id: authenticode
        shell: bash
        env:
          PUBLISH: ${{ needs.gate.outputs.publish }}
        run: |
          configured=0
          [ -n "$WINDOWS_CERT_BASE64" ] && configured=$((configured + 1))
          [ -n "$WINDOWS_CERT_PASSWORD" ] && configured=$((configured + 1))

          if [ "$configured" -eq 1 ]; then
            echo "::error::Windows signing is only half configured"
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$configured" -ne 2 ]; then
            echo "::error::Published releases require both Windows signing secrets"
            exit 1
          fi
          if [ "$configured" -eq 0 ]; then
            echo "::warning::Building an unsigned installer; this run cannot publish"
            exit 0
          fi

          printf '%s' "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin"             -name signtool.exe -path '*x64*' | sort | tail -1)
          [ -n "$signtool" ] || { echo "::error::signtool not found"; exit 1; }

          for installer in desktop/dist/*.exe; do
            "$signtool" sign //fd SHA256 //td SHA256               //tr http://timestamp.digicert.com               //f "$RUNNER_TEMP/cert.pfx" //p "$WINDOWS_CERT_PASSWORD"               "$installer"
            # A signature that verifies now and expires with the certificate
            # is not a signature anybody can check in two years. `//tr` is
            # what makes it outlive the cert, and this proves it took.
            "$signtool" verify //pa //v "$installer"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp desktop/dist/*.exe artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  # --------------------------------------------------------------- Extension --
  # The store uploads. Every release carries them so that submitting is
  # choosing a file rather than remembering how to build one — and so that what
  # is submitted is the reviewed commit, not somebody's working tree.
  #
  # Nothing here signs anything: Chrome Web Store, Edge Add-ons and AMO all
  # sign on their side, after a submission made with an account no workflow
  # should hold.
  extension:
    name: Browser extension packages
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci`: the packager uses only Node built-ins on purpose, so this
      # step cannot pull code from the network into a signed artefact.
      - name: Package for each store
        run: node tools/package-extension.js --out artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: artifacts/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Linux packages
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: BlueZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build agent, CLI and initrd client
        working-directory: desktop
        run: |
          cargo build --release \
            -p phone-auth-agent -p phone-auth-cli -p phone-auth-initrd

      # A plain tarball for headless machines and for anyone whose distribution
      # is not Debian-shaped. The initrd binary only makes sense here.
      # Cargo names a binary after its `[[bin]]` entry, so the CLI crate
      # `phone-auth-cli` produces `phone-auth`.
      - name: Tarball the binaries
        run: |
          mkdir -p artifacts staging/phone-auth
          cp desktop/target/release/phone-auth-agent \
             desktop/target/release/phone-auth \
             desktop/target/release/phone-auth-webauthn-host \
             desktop/target/release/phone-auth-initrd \
             staging/phone-auth/
          cp -r desktop/browser-extension staging/phone-auth/
          cp README.md docs/desktop.md docs/protocol-handshake.md docs/webauthn.md \
             staging/phone-auth/
          tar -czf artifacts/phone-auth-linux-x86_64.tar.gz -C staging phone-auth

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/ui/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Package tray
        working-directory: desktop/ui
        run: |
          npm ci
          npx electron-builder --linux --publish never

      - name: Collect artifacts
        run: cp desktop/dist/*.AppImage desktop/dist/*.deb artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  # ------------------------------------------------------------------- Nix ---
  nix:
    name: NixOS package
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Nix does not share Cargo's cache, so without this the whole Rust
      # workspace is compiled from source again here — the slowest job of the
      # five. Caches /nix/store itself, keyed on the inputs that decide what
      # gets built. The size cap keeps the cache under the 10 GB a repository
      # gets before GitHub starts evicting other entries.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'desktop/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 604800
          purge-primary-key: never

      # The headless package: agent, CLI and initrd client. This is what the
      # NixOS module installs, and it needs no npm.
      - name: Build the flake package
        run: nix build .#default --print-build-logs

      - name: Check the flake evaluates
        run: nix flake check --no-build

      # `packages.phone-auth-tray` pins an npm dependency hash that Nix can only
      # produce by fetching. Printing it here is what closes that loop: paste the
      # value into `desktop/nixos/package.nix` to make the tray buildable.
      - name: Report the tray's npm dependency hash
        continue-on-error: true
        run: |
          nix run nixpkgs#prefetch-npm-deps -- desktop/ui/package-lock.json \
            | tee npm-deps-hash.txt

      - name: Stage the closure
        run: |
          mkdir -p artifacts
          tar -czhf artifacts/phone-auth-nixos-x86_64.tar.gz -C result .
          if [ -f npm-deps-hash.txt ]; then cp npm-deps-hash.txt artifacts/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nix
          path: artifacts/*
          if-no-files-found: error

  # --------------------------------------------------------------- Release ---
  release:
    name: Publish release
    needs: [gate, android, windows, linux, nix, extension]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Flatten and checksum
        run: |
          mkdir -p release
          find incoming -type f ! -name 'npm-deps-hash.txt' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      # A checksum file served from the same place as the artifacts proves
      # they were not corrupted in transit. It proves nothing about
      # substitution: whoever could replace the download could replace the
      # list of hashes beside it.
      #
      # Provenance closes that. Each artifact is signed with a certificate
      # issued to this workflow run and logged publicly, so `gh attestation
      # verify` can say which commit and which workflow produced a file. No
      # key exists for the project to hold, lose, or have taken.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      # `tag_name` is explicit because on a push to main the ref is a branch.
      # The action creates the tag at this commit as part of creating the
      # release, so the tag only ever exists for a build that got this far.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            | Platform | File |
            |---|---|
            | Android | `PhoneAuth-android.apk` |
            | Windows 11 x64 | `PhoneAuth-Setup-*.exe` |
            | Linux x64 (portable) | `PhoneAuth-*.AppImage` |
            | Debian / Ubuntu x64 | `*.deb` |
            | Headless Linux x64 | `phone-auth-linux-x86_64.tar.gz` |
            | NixOS | `nix build github:${{ github.repository }}#default` |
            | Browser extension | `phoneauth-passkeys-*-*.zip` |

            ### Verifying a download

            `SHA256SUMS.txt` catches a corrupted download. It cannot catch a
            substituted one — whoever could replace a file could replace the
            list beside it. For that, every artifact here carries signed build
            provenance:

            ```
            gh attestation verify <file> --repo ${{ github.repository }}
            ```

            That says which commit and which workflow run produced the file.

            The Android APK is signed with the project release key and the
            Windows installer with the project Authenticode certificate. The
            workflow refuses to publish when any signing secret is absent, so
            an unsigned artifact cannot reach a release.

            The extension zips are **store uploads, not installable files**.
            Chrome, Edge and Firefox each sign on their side. To install one
            without a store, see the enterprise channel in `docs/webauthn.md`.

            ## Pairing

            Install the desktop side, open PhoneAuth, choose **Pair a phone…**,
            and scan the code with the app. Both screens then show six digits —
            they must match before you confirm. The code on screen authenticates
            the desktop to the phone; the six digits close the other direction.
