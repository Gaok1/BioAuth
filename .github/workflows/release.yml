name: Release

# Builds every artifact a user could install and attaches them to a GitHub
# Release. Three ways in, all landing in the same jobs:
#
#   push to main   bump the workspace version and the release cuts itself
#   push of a tag  release that exact tag, for anything cut by hand
#   dispatch       build the whole set; publish only if asked, and then only
#                  as an unsigned debug prerelease
#
# The tag is created by the release step rather than pushed by an earlier job,
# because a tag pushed with GITHUB_TOKEN does not trigger workflows — GitHub
# blocks that to stop runs feeding themselves. A two-workflow design would look
# right and silently build nothing.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish an unsigned debug prerelease, so the build can be downloaded
          from the releases page instead of dug out of a run's artifact list.
          Every file is renamed with a -debug marker and the release is flagged
          as a prerelease. This door cannot produce a stable release.
        type: boolean
        default: false

permissions:
  contents: write
  # Build provenance is signed with a short-lived certificate issued to this
  # workflow run, so there is no key for anybody to hold or lose.
  id-token: write
  attestations: write

env:
  FLUTTER_VERSION: 3.47.1
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ Gate ---
  # Decides the version and whether this run has anything to do, so an ordinary
  # commit to main costs ten seconds instead of four parallel builds.
  gate:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      # `stable` is the released product and must be signed with the project
      # keys. `debug` is explicitly unsigned, named so on every file, and can
      # only ever come out as a prerelease.
      channel: ${{ steps.decide.outputs.channel }}
    # Read here only to answer "could this run sign at all?" before spending
    # four parallel builds on a stable release that would fail at the last step.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Five files carry the version independently. They are all read by
      # something a user sees — the installer filename, the APK's versionName,
      # the Nix package, the version a browser shows on its extensions page —
      # so a release where they disagree ships artifacts that claim to be
      # different versions of each other.
      - name: Check the declared versions agree
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' \
            desktop/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version in desktop/Cargo.toml"; exit 1; }
          echo "canonical: $version"

          fail=0
          check() {
            if [ "$2" != "$version" ]; then
              echo "::error::$1 declares '$2', desktop/Cargo.toml says '$version'"
              fail=1
            fi
          }
          check mobile/pubspec.yaml \
            "$(sed -n 's/^version: \([0-9.]*\).*/\1/p' mobile/pubspec.yaml | head -1)"
          check desktop/ui/package.json \
            "$(sed -n 's/.*"version": "\(.*\)".*/\1/p' desktop/ui/package.json | head -1)"
          check desktop/nixos/package.nix \
            "$(sed -n 's/.*version = "\(.*\)".*/\1/p' desktop/nixos/package.nix | head -1)"
          check desktop/browser-extension/manifest.json \
            "$(sed -n 's/.*"version": "\(.*\)".*/\1/p' desktop/browser-extension/manifest.json | head -1)"
          [ "$fail" = 0 ] || exit 1

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide what to do
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          # Six secrets, all or nothing. Asking now costs ten seconds and turns
          # a guaranteed forty-minute failure into an explanation. It lowers no
          # bar: a run that cannot sign still publishes nothing as stable.
          signable=true
          for value in             "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD"             "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"             "$WINDOWS_CERT_BASE64" "$WINDOWS_CERT_PASSWORD"; do
            [ -n "$value" ] || signable=false
          done

          emit() {
            echo "tag=$1" >> "$GITHUB_OUTPUT"
            echo "build=$2" >> "$GITHUB_OUTPUT"
            echo "publish=$3" >> "$GITHUB_OUTPUT"
            echo "channel=$4" >> "$GITHUB_OUTPUT"
          }

          # Branch on the event before the ref. A dispatch is almost always
          # launched from main, so a `case` on the ref alone routes every
          # manual run into the main-push arm and the dispatch arm never runs —
          # which is exactly what happened the first time somebody used it.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Builds the whole set either way; publishes only when asked, and
            # then on a tag that cannot collide with the stable one.
            if [ "$DISPATCH_PUBLISH" = "true" ]; then
              emit "v$VERSION-debug.$GITHUB_RUN_NUMBER" true true debug
            else
              emit "v$VERSION" true false debug
            fi
            exit 0
          fi

          case "$GITHUB_REF" in
            refs/tags/v*)
              # Cut by hand. Build and publish exactly this tag.
              emit "${GITHUB_REF#refs/tags/}" true true stable
              ;;
            refs/heads/main)
              tag="v$VERSION"
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "$tag already exists — nothing to release."
                emit "$tag" false false stable
              elif [ "$signable" = false ]; then
                # Refuse early and say which door does produce something
                # installable, instead of failing four builds deep with a
                # message about a secret.
                echo "::warning::$tag is unreleased, but signing is not configured, so no stable release can come from this commit. Run this workflow manually with publish=true for an unsigned debug prerelease."
                emit "$tag" false false stable
              else
                echo "version bumped to $VERSION — releasing $tag."
                emit "$tag" true true stable
              fi
              ;;
            *)
              # A push to any other branch. Prove the build still works.
              emit "v$VERSION" true false debug
              ;;
          esac
  # ---------------------------------------------------------------- Android --
  android:
    name: Android APK
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Lifted to the job so a step condition can read it: the `secrets` context
    # is not available inside an `if`, and a workflow that references it there
    # fails to parse rather than evaluating to false.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter-action`'s cache covers the SDK, not the packages it resolves,
      # and not Gradle's dependency downloads — which are the slow half of an
      # APK build.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      # A stable release must be signed with the project key. Without the
      # secrets the build still happens, but only as an explicitly named debug
      # artifact — which can reach a prerelease and never a stable release.
      - name: Validate and decode signing material
        id: signing
        env:
          CHANNEL: ${{ needs.gate.outputs.channel }}
        run: |
          configured=0
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done

          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "::error::Android release signing is only partially configured"
            exit 1
          fi
          if [ "$CHANNEL" = stable ] && [ "$configured" -ne 4 ]; then
            echo "::error::A stable release requires all four Android signing secrets"
            exit 1
          fi
          if [ "$configured" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/release.jks
          cat > mobile/android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile
        run: |
          flutter build apk --release --flavor prod --target lib/main_prod.dart
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
             ../artifacts/PhoneAuth-android.apk

      - name: Build debug-signed APK
        if: steps.signing.outputs.signed != 'true'
        working-directory: mobile
        run: |
          flutter build apk --debug --flavor prod --target lib/main_prod.dart
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-prod-debug.apk \
             ../artifacts/PhoneAuth-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows installer
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    # Lifted to the job for the same reason the Android secrets are: the
    # `secrets` context cannot be read inside a step `if`.
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # The installer bundles these, so they have to exist before packaging.
      # `phone-auth-initrd` is deliberately absent: it unlocks a LUKS volume
      # from a Linux initrd and means nothing on Windows.
      - name: Build agent and CLI
        working-directory: desktop
        run: cargo build --release -p phone-auth-agent -p phone-auth-cli

      - name: Build Windows WebAuthn plugin
        shell: powershell
        run: .\desktop\windows-plugin\build.ps1 -Configuration release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      # `npm ci` is cached by setup-node, but electron-builder separately pulls
      # down the Electron runtime and its winCodeSign helper on every run —
      # roughly 150 MB that never changes between releases.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/ui/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Prepare Authenticode signing
        shell: bash
        env:
          CHANNEL: ${{ needs.gate.outputs.channel }}
        run: |
          configured=0
          [ -n "$WINDOWS_CERT_BASE64" ] && configured=$((configured + 1))
          [ -n "$WINDOWS_CERT_PASSWORD" ] && configured=$((configured + 1))
          if [ "$configured" -eq 1 ]; then
            echo "::error::Windows signing is only half configured"
            exit 1
          fi
          if [ "$CHANNEL" = stable ] && [ "$configured" -ne 2 ]; then
            echo "::error::A stable release requires both Windows signing secrets"
            exit 1
          fi
          if [ "$configured" -eq 0 ]; then
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "WIN_CSC_LINK=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Package tray
        working-directory: desktop/ui
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          npm ci
          npx electron-builder --win --publish never

      # Authenticode. Without it Windows shows "Unknown publisher" on every
      # install and SmartScreen warns for as long as the download is rare —
      # which teaches users to click through exactly the warning that would
      # tell them about a substituted installer.
      #
      # Same shape as the Android rule: an unsigned installer may ship as a
      # debug prerelease that says so in its filename, never as stable.
      - name: Verify Authenticode on app, helpers and installer
        id: authenticode
        shell: bash
        run: |
          if [ "$SIGNING_CONFIGURED" != true ]; then
            echo "::warning::Building an unsigned installer; it can only ship as a debug prerelease"
            exit 0
          fi
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin"             -name signtool.exe -path '*x64*' | sort | tail -1)
          [ -n "$signtool" ] || { echo "::error::signtool not found"; exit 1; }
          executables=(desktop/dist/PhoneAuth-Setup-*.exe)
          while IFS= read -r -d '' executable; do
            executables+=("$executable")
          done < <(find desktop/dist/win-unpacked -type f -iname '*.exe' -print0)
          for executable in "${executables[@]}"; do
            "$signtool" verify //pa //v "$executable"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp desktop/dist/*.exe artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  # --------------------------------------------------------------- Extension --
  # The store uploads. Every release carries them so that submitting is
  # choosing a file rather than remembering how to build one — and so that what
  # is submitted is the reviewed commit, not somebody's working tree.
  #
  # Nothing here signs anything: Chrome Web Store, Edge Add-ons and AMO all
  # sign on their side, after a submission made with an account no workflow
  # should hold.
  extension:
    name: Browser extension packages
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`: the packager uses only Node built-ins on purpose, so this
      # step cannot pull code from the network into a signed artefact.
      - name: Package for each store
        run: node tools/package-extension.js --out artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: artifacts/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Linux packages
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: BlueZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build agent, CLI and initrd client
        working-directory: desktop
        run: |
          cargo build --release \
            -p phone-auth-agent -p phone-auth-cli -p phone-auth-initrd

      # A plain tarball for headless machines and for anyone whose distribution
      # is not Debian-shaped. The initrd binary only makes sense here.
      # Cargo names a binary after its `[[bin]]` entry, so the CLI crate
      # `phone-auth-cli` produces `phone-auth`.
      - name: Tarball the binaries
        run: |
          mkdir -p artifacts staging/phone-auth
          cp desktop/target/release/phone-auth-agent \
             desktop/target/release/phone-auth \
             desktop/target/release/phone-auth-webauthn-host \
             desktop/target/release/phone-auth-initrd \
             staging/phone-auth/
          cp -r desktop/browser-extension staging/phone-auth/
          mkdir -p staging/phone-auth/file-manager
          cp desktop/file-manager/phone-auth-file-manager.* \
             desktop/file-manager/install-nautilus.sh \
             staging/phone-auth/file-manager/
          cp README.md docs/desktop.md docs/protocol-handshake.md docs/webauthn.md \
             staging/phone-auth/
          mkdir -p staging/phone-auth/docs
          cp docs/file-manager-integration.md staging/phone-auth/docs/
          tar -czf artifacts/phone-auth-linux-x86_64.tar.gz -C staging phone-auth

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/ui/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Package tray
        working-directory: desktop/ui
        run: |
          npm ci
          npx electron-builder --linux --publish never

      - name: Collect artifacts
        run: cp desktop/dist/*.AppImage desktop/dist/*.deb artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  # ------------------------------------------------------------------- Nix ---
  nix:
    name: NixOS package
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Nix does not share Cargo's cache, so without this the whole Rust
      # workspace is compiled from source again here — the slowest job of the
      # five. Caches /nix/store itself, keyed on the inputs that decide what
      # gets built. The size cap keeps the cache under the 10 GB a repository
      # gets before GitHub starts evicting other entries.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'desktop/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 604800
          purge-primary-key: never

      # The headless package: agent, CLI and initrd client. This is what the
      # NixOS module installs, and it needs no npm.
      - name: Build the flake package
        run: nix build .#default --print-build-logs

      - name: Check the flake evaluates
        run: nix flake check --no-build

      # `packages.phone-auth-tray` pins an npm dependency hash that Nix can only
      # produce by fetching. Printing it here is what closes that loop: paste the
      # value into `desktop/nixos/package.nix` to make the tray buildable.
      - name: Report the tray's npm dependency hash
        continue-on-error: true
        run: |
          nix run nixpkgs#prefetch-npm-deps -- desktop/ui/package-lock.json \
            | tee npm-deps-hash.txt

      - name: Stage the closure
        run: |
          mkdir -p artifacts
          tar -czhf artifacts/phone-auth-nixos-x86_64.tar.gz -C result .
          if [ -f npm-deps-hash.txt ]; then cp npm-deps-hash.txt artifacts/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nix
          path: artifacts/*
          if-no-files-found: error

  # --------------------------------------------------------------- Release ---
  release:
    name: Publish release
    needs: [gate, android, windows, linux, nix, extension]
    # A stable release is all or nothing: one missing platform makes it a
    # broken release rather than a partial one. A debug prerelease is the
    # opposite — its only job is getting builds into someone's hands, and
    # holding four good packages back because a fifth failed is not caution.
    # That is not hypothetical: `nix` failing once left a working APK and a
    # working Windows installer unpublished.
    #
    # `!cancelled()` rather than `always()`, because a run somebody cancelled
    # should stay cancelled instead of publishing half of itself.
    if: >-
      !cancelled()
      && needs.gate.outputs.publish == 'true'
      && (needs.gate.outputs.channel == 'debug'
          || !contains(needs.*.result, 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      # Shipped with the release rather than only kept in CI. Answering "was
      # the version I installed affected by this" months from now needs the
      # dependency list as it was then, and a list that only exists in an
      # expired workflow run does not answer it.
      - name: Make room for the release set
        run: mkdir -p release

      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/sbom.cyclonedx.json
          upload-artifact: false

      - name: Flatten and checksum
        env:
          CHANNEL: ${{ needs.gate.outputs.channel }}
        run: |
          mkdir -p release
          find incoming -type f ! -name 'npm-deps-hash.txt' -exec cp {} release/ \;
          cd release

          # On the debug channel the file has to say what it is by its own
          # name. A download is separated from the page that called it a
          # prerelease the moment it lands in ~/Downloads, and an unsigned
          # build that looks like the real one is the entire risk here.
          # Checksums are computed after the rename, so the list describes the
          # files that actually ship.
          if [ "$CHANNEL" = debug ]; then
            for f in *; do
              case "$f" in
                sbom.cyclonedx.json|*-debug|*-debug.*) continue ;;
                *.tar.gz) mv -- "$f" "${f%.tar.gz}-debug.tar.gz" ;;
                *.*)      mv -- "$f" "${f%.*}-debug.${f##*.}" ;;
                *)        mv -- "$f" "$f-debug" ;;
              esac
            done
          fi

          # Every build failing leaves only the SBOM behind, and a release
          # holding nothing but its own dependency list is an empty box with
          # a bow on it.
          if [ -z "$(find . -type f ! -name 'sbom.cyclonedx.json' -print -quit)" ]; then
            echo "::error::every build failed, so there is nothing to publish"
            exit 1
          fi

          sha256sum * > SHA256SUMS.txt
          ls -lh

      # A checksum file served from the same place as the artifacts proves
      # they were not corrupted in transit. It proves nothing about
      # substitution: whoever could replace the download could replace the
      # list of hashes beside it.
      #
      # Provenance closes that. Each artifact is signed with a certificate
      # issued to this workflow run and logged publicly, so `gh attestation
      # verify` can say which commit and which workflow produced a file. No
      # key exists for the project to hold, lose, or have taken.
      # A debug prerelease that quietly lacks the APK is a trap of the
      # same family as an unsigned file with a trustworthy name: what is
      # missing has to be legible on the page, not inferred by noticing
      # that the file list is shorter than usual.
      - name: Note any target that did not build
        id: missing
        env:
          RESULTS: |
            Android APK:${{ needs.android.result }}
            Windows installer:${{ needs.windows.result }}
            Linux packages:${{ needs.linux.result }}
            NixOS package:${{ needs.nix.result }}
            Browser extensions:${{ needs.extension.result }}
        run: |
          absent=$(echo "$RESULTS" | awk -F: '
            NF == 2 && $2 != "success" { print "> - **" $1 "** — " $2 }')
          {
            echo 'note<<NOTE_EOF'
            if [ -n "$absent" ]; then
              echo '> [!WARNING]'
              echo '> **This build is incomplete.** These targets produced'
              echo '> no artifacts, so what follows is only part of the set:'
              echo '>'
              echo "$absent"
            fi
            echo NOTE_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      # `tag_name` is explicit because on a push to main the ref is a branch.
      # The action creates the tag at this commit as part of creating the
      # release, so the tag only ever exists for a build that got this far.
      - name: Publish stable release
        if: needs.gate.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            | Platform | File |
            |---|---|
            | Android | `PhoneAuth-android.apk` |
            | Windows 11 x64 | `PhoneAuth-Setup-*.exe` |
            | Linux x64 (portable) | `PhoneAuth-*.AppImage` |
            | Debian / Ubuntu x64 | `*.deb` |
            | Headless Linux x64 | `phone-auth-linux-x86_64.tar.gz` |
            | NixOS | `nix build github:${{ github.repository }}#default` |
            | Browser extension | `phoneauth-passkeys-*-*.zip` |

            `sbom.cyclonedx.json` lists every dependency this release was built
            from, so a future advisory can be checked against what actually
            shipped.

            ### Verifying a download

            `SHA256SUMS.txt` catches a corrupted download. It cannot catch a
            substituted one — whoever could replace a file could replace the
            list beside it. For that, every artifact here carries signed build
            provenance:

            ```
            gh attestation verify <file> --repo ${{ github.repository }}
            ```

            That says which commit and which workflow run produced the file.

            The Android APK is signed with the project release key and the
            Windows installer with the project Authenticode certificate. The
            workflow refuses to publish when any signing secret is absent, so
            an unsigned artifact cannot reach a release.

            The extension zips are **store uploads, not installable files**.
            Chrome, Edge and Firefox each sign on their side. To install one
            without a store, see the enterprise channel in `docs/webauthn.md`.

            ## Pairing

            Install the desktop side, open PhoneAuth, choose **Pair a phone…**,
            and scan the code with the app. Both screens then show six digits —
            they must match before you confirm. The code on screen authenticates
            the desktop to the phone; the six digits close the other direction.

      # The debug channel. Same artifacts, none of them signed, every filename
      # saying so, and `prerelease: true` so it never becomes what a plain
      # visitor to the releases page downloads by default.
      - name: Publish debug prerelease
        if: needs.gate.outputs.channel == 'debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.gate.outputs.tag }} — unsigned debug build
          files: release/*
          prerelease: true
          generate_release_notes: true
          body: |
            ${{ steps.missing.outputs.note }}

            ## Unsigned debug build — for testing, not for use

            Nothing in this release is signed, and every filename carries
            `-debug` so a file that has left this page still says what it is.

            "Debug" means different things per artifact, and the difference
            matters:

            - **The Android APK is a real debug build** signed with the
              throwaway debug key.
            - **The desktop binaries are release-optimised**, just unsigned.
              Windows will call the publisher unknown and SmartScreen will warn
              until the download is common, which it never will be.

            Two things to know before installing:

            - **The APK cannot be upgraded in place** to a signed build later.
              Android refuses an update whose signing key changed, so moving to
              a real release means uninstalling first — and uninstalling takes
              the pairings, passkeys and vault entries created while testing.
              Treat anything you set up here as disposable.
            - **Provenance still works**, because it needs no project key:

              ```
              gh attestation verify <file> --repo ${{ github.repository }}
              ```

              That says which commit and which workflow run produced the file,
              which is the half of the signing story that is not missing here.

            | Platform | File |
            |---|---|
            | Android | `PhoneAuth-android-debug.apk` |
            | Windows 11 x64 | `PhoneAuth-Setup-*-debug.exe` |
            | Linux x64 (portable) | `PhoneAuth-*-debug.AppImage` |
            | Debian / Ubuntu x64 | `*-debug.deb` |
            | Headless Linux x64 | `phone-auth-linux-x86_64-debug.tar.gz` |
            | Browser extension | `phoneauth-passkeys-*-debug.zip` |

            The extension zips are store uploads, not installable files — load
            one unpacked to try it.

            ## Pairing

            Install the desktop side, open PhoneAuth, choose **Pair a phone…**,
            and scan the code with the app. Both screens then show six digits —
            they must match before you confirm. The code on screen authenticates
            the desktop to the phone; the six digits close the other direction.
